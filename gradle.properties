# Configure Gradle to use Java 21 for Gradle 9.0 compatibility
org.gradle.java.home=C:/Program Files/Microsoft/jdk-21.0.7.6-hotspot

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=NONE -Djavax.net.ssl.trustStoreType=Windows-ROOT -Dcom.sun.net.ssl.checkRevocation=false -Dtrust_all_cert=true -Djavax.net.ssl.trustStorePassword= -Djava.net.useSystemProxies=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Gradle 9.0 performance and compatibility settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=true

# Gradle 9.0 build optimizations
org.gradle.unsafe.configuration-cache=true
android.experimental.lint.missingBaselineIsEmptyBaseline=true

# Enhanced SSL settings for corporate networks
systemProp.javax.net.ssl.trustStore=
systemProp.javax.net.ssl.trustStorePassword=
systemProp.javax.net.ssl.keyStore=
systemProp.javax.net.ssl.keyStorePassword=
systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.trust_all_cert=true
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
# systemProp.java.net.useSystemProxies=true
